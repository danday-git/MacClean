name: SweepMyMac
options:
  bundleIdPrefix: com.sweepmymac
  deploymentTarget:
    macOS: 14.0

targets:
  SweepMyMac:
    type: application
    platform: macOS
    sources: [SweepMyMac]
    info:
      path: SweepMyMac/Resources/Info.plist
      properties:
        CFBundleName: SweepMyMac
        CFBundleDisplayName: SweepMyMac
        CFBundleIdentifier: com.sweepmymac.SweepMyMac
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: YES
      SWIFT_VERSION: 5.0
      PRODUCT_BUNDLE_IDENTIFIER: com.sweepmymac.SweepMyMac
      DEVELOPMENT_TEAM: "" # You can add team ID later

  SweepMyMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SweepMyMacTests]
    dependencies:
      - target: SweepMyMac
    settings:
      SWIFT_VERSION: 5.0
      GENERATE_INFOPLIST_FILE: YES
