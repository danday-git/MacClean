name: MacClean
options:
  bundleIdPrefix: com.macclean
  deploymentTarget:
    macOS: 14.0

targets:
  MacClean:
    type: application
    platform: macOS
    sources: [MacClean]
    info:
      path: MacClean/Resources/Info.plist
      properties:
        CFBundleName: MacClean
        CFBundleDisplayName: MacClean
        CFBundleIdentifier: com.macclean.MacClean
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: 1
        LSMinimumSystemVersion: 14.0
        NSPrincipalClass: NSApplication
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: YES
      SWIFT_VERSION: 5.0
      PRODUCT_BUNDLE_IDENTIFIER: com.macclean.MacClean
      DEVELOPMENT_TEAM: "" # You can add team ID later

  MacCleanTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MacCleanTests]
    dependencies:
      - target: MacClean
    settings:
      SWIFT_VERSION: 5.0
